<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download File</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:400px;
            background:#fff;
            padding:30px;
            border-radius:12px;
            box-shadow:0 5px 15px rgba(0,0,0,.2);
            text-align:center;
        }

        h1{
            color:#333;
            margin-bottom:10px;
        }

        p{
            color:#666;
            margin-bottom:25px;
        }

        .download-btn{
            display:block;
            width:100%;
            text-decoration:none;
            color:white;
            background:#007bff;
            padding:14px;
            margin:10px 0;
            border-radius:8px;
            font-size:17px;
            transition:.3s;
        }

        .download-btn:hover{
            background:#0056b3;
            transform:scale(1.02);
        }

        .pdf{
            background:#dc3545;
        }

        .pdf:hover{
            background:#b02a37;
        }

        .doc{
            background:#198754;
        }

        .doc:hover{
            background:#146c43;
        }

        .img{
            background:#fd7e14;
        }

        .img:hover{
            background:#ca6510;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Download File</h1>
    <p>Silakan pilih file yang ingin diunduh.</p>

    <a href="files/manajemen siswa.py" download class="download-btn pdf">
        📄 Download Manajemen Siswa (Python)
    </a>

</div>

</body>
</html>
